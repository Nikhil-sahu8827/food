server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: food-ordering-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurant_db}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RestaurantHikariPool
      # Conservative pool size for Supabase Free tier (typically 15 max connections)
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      leak-detection-threshold: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Security & JWT
app:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JGb29kT3JkZXJpbmdXZWJzaXRlMjAyNg==}
    expiration-ms: 86400000 # 24 Hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  admin:
    default-email: ${ADMIN_EMAIL:admin@restaurant.com}
    default-password: ${ADMIN_PASSWORD:AdminPassword@123}
    default-name: ${ADMIN_NAME:Head Administrator}
    default-mobile: ${ADMIN_MOBILE:+919876543210}
  retention:
    days: 30
    cron: "0 0 3 * * *"
  storage:
    upload-dir: ${UPLOAD_DIR:uploads/food-images}
    max-file-size-mb: 2
    supabase-url: ${SUPABASE_URL:}
    supabase-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    supabase-bucket: ${SUPABASE_STORAGE_BUCKET:food-images}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

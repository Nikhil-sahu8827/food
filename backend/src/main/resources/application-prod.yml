server:
  port: ${PORT:8080}

spring:
  datasource:
    # Supabase connection string format: jdbc:postgresql://db.[ref].supabase.co:5432/postgres?sslmode=require
    # Or Supabase Transaction Pooler: jdbc:postgresql://aws-0-[region].pooler.supabase.com:6543/postgres?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.restaurant: INFO
    org.springframework.security: WARN

services:
  - type: web
    name: food-ordering-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: food-ordering-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@restaurant.com
      - key: ADMIN_PASSWORD
        value: AdminPassword@123
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: food-ordering-db
    plan: free
    region: singapore
